<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصر الرعب الناجي - لعبة البقاء</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0e;
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border: 3px solid #332222;
            background: #121015;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #18161f;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .hud-box {
            background: rgba(20, 20, 25, 0.85);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #443333;
        }
        #message-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid #662222;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: #ffcccc;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            display: none;
        }
        #controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
        /* Mobile On-Screen Controls */
        #mobile-controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .m-btn {
            background: #2a2233;
            color: white;
            border: 1px solid #554466;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .m-btn:active {
            background: #443355;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <div class="hud-box" id="coin-display">💰 0</div>
            <div class="hud-box" id="timer-display" style="color: #ff6666;">⏳ 30 ثانية</div>
            <div class="hud-box" id="status-display">تتجول</div>
        </div>
        <div id="message-box">رسالة</div>
    </div>

    <div id="controls-hint">التحكم: <b>W A S D</b> للحركة | <b>E</b> للنوم | أزرار <b>1-4</b> للتطوير</div>
    
    <div id="mobile-controls">
        <button class="m-btn" onclick="handleInteraction()">زر النوم (E)</button>
        <button class="m-btn" onclick="handleUpgradeOrBuild(1)">غرفة 1</button>
        <button class="m-btn" onclick="handleUpgradeOrBuild(2)">غرفة 2</button>
        <button class="m-btn" onclick="handleUpgradeOrBuild(3)">غرفة 3</button>
        <button class="m-btn" onclick="handleUpgradeOrBuild(4)">غرفة 4</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let coins = 0;
        let gameTime = 0;
        let monsterSpawnTime = 30;
        let monsterSpawned = false;
        let gameOver = false;
        let gameWon = false;

        let player = {
            x: 400,
            y: 300,
            radius: 12,
            speed: 3.2,
            isSleeping: false,
            currentBed: null
        };

        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'e') handleInteraction();
            if (['1', '2', '3', '4'].includes(e.key)) handleUpgradeOrBuild(parseInt(e.key));
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        // Touch support for movement on canvas
        let touchTarget = null;
        canvas.addEventListener('touchstart', (e) => {
            let rect = canvas.getBoundingClientRect();
            touchTarget = {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        });
        canvas.addEventListener('touchmove', (e) => {
            let rect = canvas.getBoundingClientRect();
            touchTarget = {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        });
        canvas.addEventListener('touchend', () => {
            touchTarget = null;
        });

        let rooms = [
            { id: 1, x: 50, y: 50, w: 320, h: 220, name: "الغرفة الشمالية الغربية", bed: { x: 100, y: 100, level: 1 }, door: { x: 370, y: 140, w: 20, h: 60, hp: 100, maxHp: 100, level: 1 }, weaponSlot: { x: 200, y: 100, weapon: null } },
            { id: 2, x: 430, y: 50, w: 320, h: 220, name: "الغرفة الشمالية الشرقية", bed: { x: 480, y: 100, level: 1 }, door: { x: 410, y: 140, w: 20, h: 60, hp: 100, maxHp: 100, level: 1 }, weaponSlot: { x: 580, y: 100, weapon: null } },
            { id: 3, x: 50, y: 330, w: 320, h: 220, name: "الغرفة الجنوبية الغربية", bed: { x: 100, y: 380, level: 1 }, door: { x: 370, y: 410, w: 20, h: 60, hp: 100, maxHp: 100, level: 1 }, weaponSlot: { x: 200, y: 380, weapon: null } },
            { id: 4, x: 430, y: 330, w: 320, h: 220, name: "الغرفة الجنوبية الشرقية", bed: { x: 480, y: 380, level: 1 }, door: { x: 410, y: 410, w: 20, h: 60, hp: 100, maxHp: 100, level: 1 }, weaponSlot: { x: 580, y: 380, weapon: null } }
        ];

        let monster = {
            x: 400,
            y: 300,
            radius: 16,
            speed: 1.4,
            hp: 200,
            maxHp: 200,
            active: false
        };

        function showMessage(text, duration = 3000) {
            const msgBox = document.getElementById('message-box');
            msgBox.innerText = text;
            msgBox.style.display = 'block';
            setTimeout(() => { msgBox.style.display = 'none'; }, duration);
        }

        function handleInteraction() {
            if (gameOver || gameWon) return;
            if (player.isSleeping) {
                showMessage("أنت مستغرق في النوم ولا يمكنك النهوض!");
                return;
            }
            for (let room of rooms) {
                let dist = Math.hypot(player.x - room.bed.x, player.y - room.bed.y);
                if (dist < 45) {
                    player.isSleeping = true;
                    player.currentBed = room.bed;
                    player.x = room.bed.x;
                    player.y = room.bed.y + 15;
                    document.getElementById('status-display').innerText = "نائم 💤";
                    showMessage("لقد نمت بعمق.. تبدأ بكسب العملات كل ثانية!");
                    break;
                }
            }
        }

        function handleUpgradeOrBuild(roomNum) {
            if (gameOver || gameWon) return;
            let room = rooms[roomNum - 1];
            if (!room) return;

            let distToBed = Math.hypot(player.x - room.bed.x, player.y - room.bed.y);
            let distToWeapon = Math.hypot(player.x - room.weaponSlot.x, player.y - room.weaponSlot.y);

            if (distToBed < 60) {
                let cost = room.bed.level * 30;
                if (coins >= cost) {
                    coins -= cost;
                    room.bed.level++;
                    showMessage(`تم ترقية سرير ${room.name} لمستوى ${room.bed.level}!`);
                } else {
                    showMessage(`تحتاج إلى ${cost} عملة لترقية السرير.`);
                }
            } else if (distToWeapon < 60) {
                if (!room.weaponSlot.weapon) {
                    let cost = 40;
                    if (coins >= cost) {
                        coins -= cost;
                        room.weaponSlot.weapon = { level: 1, damage: 12, range: 190, cooldown: 0 };
                        showMessage(`تم بناء سلاح دفاعي في ${room.name}!`);
                    } else {
                        showMessage(`تحتاج إلى 40 عملة لبناء السلاح.`);
                    }
                } else {
                    let cost = room.weaponSlot.weapon.level * 50;
                    if (coins >= cost) {
                        coins -= cost;
                        room.weaponSlot.weapon.level++;
                        room.weaponSlot.weapon.damage += 8;
                        showMessage(`تم ترقية السلاح في ${room.name}!`);
                    } else {
                        showMessage(`تحتاج إلى ${cost} عملة لترقية السلاح.`);
                    }
                }
            } else {
                let cost = room.door.level * 35;
                if (coins >= cost) {
                    coins -= cost;
                    room.door.level++;
                    room.door.maxHp += 50;
                    room.door.hp = room.door.maxHp;
                    showMessage(`تم ترقية باب ${room.name} وزيادة متانته!`);
                } else {
                    showMessage(`تحتاج إلى ${cost} عملة لترقية الباب.`);
                }
            }
        }

        setInterval(() => {
            if (gameOver || gameWon) return;
            gameTime++;
            if (!monsterSpawned && gameTime >= monsterSpawnTime) {
                monsterSpawned = true;
                monster.active = true;
                showMessage("⚠️ ظهر الوحش المرعب في القصر!", 5000);
            }
            if (player.isSleeping && player.currentBed) {
                coins += player.currentBed.level;
            }
        }, 1000);

        function update() {
            if (gameOver || gameWon) return;

            if (!player.isSleeping) {
                let dx = 0;
                let dy = 0;
                if (keys['w'] || keys['arrowup']) dy -= 1;
                if (keys['s'] || keys['arrowdown']) dy += 1;
                if (keys['a'] || keys['arrowleft']) dx -= 1;
                if (keys['d'] || keys['arrowright']) dx += 1;

                if (touchTarget) {
                    let angle = Math.atan2(touchTarget.y - player.y, touchTarget.x - player.x);
                    let dist = Math.hypot(touchTarget.x - player.x, touchTarget.y - player.y);
                    if (dist > 5) {
                        dx = Math.cos(angle);
                        dy = Math.sin(angle);
                    }
                }

                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                player.x += dx * player.speed;
                player.y += dy * player.speed;
                player.x = Math.max(70, Math.min(canvas.width - 70, player.x));
                player.y = Math.max(70, Math.min(canvas.height - 70, player.y));
            }

            if (monster.active) {
                let angle = Math.atan2(player.y - monster.y, player.x - monster.x);
                monster.x += Math.cos(angle) * monster.speed;
                monster.y += Math.sin(angle) * monster.speed;

                let distToPlayer = Math.hypot(monster.x - player.x, monster.y - player.y);
                if (distToPlayer < monster.radius + player.radius) {
                    gameOver = true;
                    showMessage("💀 هجم عليك الوحش وقام بالقضاء عليك!", 10000);
                }

                for (let room of rooms) {
                    if (room.weaponSlot.weapon) {
                        let wSlot = room.weaponSlot;
                        let distToMonster = Math.hypot(monster.x - wSlot.x, monster.y - wSlot.y);
                        if (distToMonster <= wSlot.weapon.range) {
                            if (wSlot.weapon.cooldown > 0) {
                                wSlot.weapon.cooldown--;
                            } else {
                                monster.hp -= wSlot.weapon.damage;
                                wSlot.weapon.cooldown = 40;
                                if (monster.hp <= 0) {
                                    gameWon = true;
                                    monster.active = false;
                                    showMessage("🎉 لقد قضيت على الوحش وفزت باللعبة!", 15000);
                                }
                            }
                        }
                    }
                }
            }

            document.getElementById('coin-display').innerText = `💰 ${coins}`;
            if (!monsterSpawned) {
                document.getElementById('timer-display').innerText = `⏳ ${monsterSpawnTime - gameTime}ث`;
            } else {
                document.getElementById('timer-display').innerText = `👹 HP: ${monster.hp}`;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let room of rooms) {
                ctx.fillStyle = '#1e1b26';
                ctx.fillRect(room.x, room.y, room.w, room.h);
                ctx.strokeStyle = '#3a324a';
                ctx.lineWidth = 2;
                ctx.strokeRect(room.x, room.y, room.w, room.h);

                ctx.fillStyle = '#665577';
                ctx.font = '11px Tahoma';
                ctx.fillText(room.name, room.x + 10, room.y + 20);

                // Bed
                ctx.fillStyle = room.bed === player.currentBed ? '#44aa44' : '#884444';
                ctx.fillRect(room.bed.x - 15, room.bed.y - 25, 30, 50);
                ctx.fillStyle = '#ffcccc';
                ctx.fillRect(room.bed.x - 12, room.bed.y - 22, 24, 15);
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px Tahoma';
                ctx.fillText(`Lv.${room.bed.level}`, room.bed.x - 12, room.bed.y + 35);

                // Door
                ctx.fillStyle = '#553322';
                ctx.fillRect(room.door.x, room.door.y, room.door.w, room.door.h);
                ctx.strokeStyle = '#774433';
                ctx.strokeRect(room.door.x, room.door.y, room.door.w, room.door.h);

                // Weapon Slot
                ctx.strokeStyle = '#555566';
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.arc(room.weaponSlot.x, room.weaponSlot.y, 14, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                if (room.weaponSlot.weapon) {
                    ctx.fillStyle = '#33ccff';
                    ctx.beginPath();
                    ctx.arc(room.weaponSlot.x, room.weaponSlot.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '9px Tahoma';
                    ctx.fillText(`W${room.weaponSlot.weapon.level}`, room.weaponSlot.x - 10, room.weaponSlot.y + 3);
                }
            }

            // Hallway
            ctx.fillStyle = '#16141c';
            ctx.fillRect(370, 50, 60, 500);

            // Player
            ctx.fillStyle = player.isSleeping ? '#44cc88' : '#e0e060';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Monster
            if (monster.active && !gameWon) {
                ctx.fillStyle = '#cc2222';
                ctx.beginPath();
                ctx.arc(monster.x, monster.y, monster.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffcccc';
                ctx.stroke();
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 28px Tahoma';
                ctx.textAlign = 'center';
                ctx.fillText("انتهت اللعبة - قُتلت!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.textAlign = 'left';
            } else if (gameWon) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#44ff44';
                ctx.font = 'bold 28px Tahoma';
                ctx.textAlign = 'center';
                ctx.fillText("تهانينا! لقد نجوت!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
